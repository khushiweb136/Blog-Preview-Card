<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    *{
      font-family: Figtree;
    }
    body{
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: hsl(47, 88%, 63%);
    }
    .card-container{
    width: min(100% - 20px, 300px);
    padding: 16px;
    height: auto;
    margin: auto;
    margin-top: 80px;
    display: block;
    background-color: hsl(0, 0%, 100%);
    border-radius: 15px;
    border: 1px solid black;
    box-shadow: 5px 5px 0px black ;
  }
  .illusimg{
    height: 10em;
    margin: 15px 0px 0px 16px ;
    border-radius: 10px;
  }
  .btn{
    height: 2em;
    width: 6em;
    margin: 15px 0px 0px 16px ;
    background-color: hsl(47, 88%, 63%);
    border-radius: 6px ;
    border: none;
    font-size: 12px;
    font-weight: 800;
  }
  
  .h5{
    font-weight: 500;
    margin: 10px 0px 0px 16px;
  }

  .h4{
    font-weight: 800;
    font-size: 16px;
    margin: 12px 0px 10px 16px;
  }

  .para{
    font-size: 0.8em;
    color: hsl(0, 0%, 42%);
    padding-left: 16px ;
  }

  .avataar{
    height: 1.7em;
    margin: 8px 0px 0px 16px ;
  }
  .name{
    font-size: 0.8em;
    font-weight: 800;
    display: inline-block;
    margin-top: 20px;
  }

  .h4:hover{
    cursor: pointer;
    color: hsl(47, 88%, 63%);
  }

  .author-container{
    display: flex;
    align-items: center;
    gap: 12px;
  }

  @media (max-width:357px){
    .card-container{
      width: 75%;
      height: 380px;
    }
    .illusimg{
      height: 9em;
      margin: 5px 0px 0px 3px ;
    }
    .para{
      font-size: 14px;
    }
  }

  </style>
</head>
<body>
  <div class="card-container"> 
  <img src="/assets/images/illustration-article.svg" class="illusimg">
  <button class="btn">Learning</button>

  <h5 class="h5">Published 21 Dec 2023</h5>

  <h4 class="h4">HTML & CSS foundations</h4> 

  <p class="para">These languages are the backbone of every website, defining structure, content, and presentation.</p>

  <div class="author-container"><img src="/assets/images/image-avatar.webp" class="avataar">
  <p class="name">Greg Hooper</p>
  </div>
 
  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</div>
 
</body>
</html>
